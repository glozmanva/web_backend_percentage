<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>Добавление расчёта</title>
    <link
            rel="stylesheet"
            href="/static/css/deposit_month.css"
    >
</head>

<body>

<div class="app">

    <main class="draft-content">

        <h1 class="page-title">
            Добавление расчёта
        </h1>

        {{ if .has_draft }}

        <div class="draft-media-grid">

            <div class="draft-media-column">
                <div class="draft-media-picker draft-media-static">
                    <img
                            class="draft-media-image"
                            src="{{ if .deposit_month.ImageURL }}{{ .deposit_month.ImageURL }}{{ else }}/static/default/default.jpg{{ end }}"
                            onerror="this.src='/static/default/default.jpg'"
                            alt="{{ .deposit_month.Name }}"
                    >
                </div>

                <span class="draft-media-label">
                    Изображение
                </span>
            </div>

            <div class="draft-media-column">
                <div class="draft-media-picker draft-media-static">
                    <video
                            class="draft-media-video"
                            autoplay
                            muted
                            loop
                            playsinline
                            preload="auto"
                            src="{{ if .deposit_month.VideoURL }}{{ .deposit_month.VideoURL }}{{ else }}/static/default/default.mp4{{ end }}"
                    ></video>
                </div>

                <span class="draft-media-label">
                    Видео
                </span>
            </div>

        </div>

        <form
                class="draft-form"
                action="/deposit_month/publish"
                method="POST"
        >

            <div class="draft-field">
                <label for="deposit-month-name">
                    Название месяца
                </label>

                <input
                        id="deposit-month-name"
                        type="text"
                        name="deposit_month_name"
                        value="{{ .deposit_month.Name }}"
                        required
                >
            </div>

            <div class="draft-field">
                <label for="deposit-month-description">
                    Описание
                </label>

                <textarea
                        id="deposit-month-description"
                        name="deposit_month_description"
                        rows="3"
                        required
                >{{ .deposit_month.Description }}</textarea>
            </div>

            <div class="draft-field">
                <label for="deposit-month-number">
                    Номер месяца
                </label>

                <input
                        id="deposit-month-number"
                        type="number"
                        name="deposit_month_month_number"
                        min="1"
                        max="12"
                        value="{{ .deposit_month.MonthNumber }}"
                        required
                >
            </div>

            <div class="draft-field">
                <label for="deposit-month-days-count">
                    Количество дней
                </label>

                <input
                        id="deposit-month-days-count"
                        type="number"
                        name="deposit_month_days_count"
                        min="28"
                        max="31"
                        value="{{ .deposit_month.DaysCount }}"
                        required
                >
            </div>

            <button
                    class="filter-button"
                    type="submit"
            >
                Опубликовать
            </button>

        </form>

        {{ else }}

        <form
                class="draft-form"
                action="/deposit_month/draft"
                method="POST"
        >

            <div class="draft-media-grid">

                <div class="draft-media-column">

                    <label class="draft-media-picker">

                        <input
                                id="deposit-month-image"
                                class="draft-file-input"
                                type="file"
                                accept="image/*"
                                required
                        >

                        <img
                                id="image-preview"
                                class="draft-media-image"
                                src="/static/default/default.jpg"
                                alt="Изображение"
                        >

                    </label>

                    <span class="draft-media-label">
                        Изображение
                    </span>

                </div>

                <div class="draft-media-column">

                    <label class="draft-media-picker">

                        <input
                                id="deposit-month-video"
                                class="draft-file-input"
                                type="file"
                                accept="video/*"
                                required
                        >

                        <video
                                id="video-preview"
                                class="draft-media-video"
                                autoplay
                                muted
                                loop
                                playsinline
                                preload="auto"
                                src="/static/default/default.mp4"
                        ></video>

                    </label>

                    <span class="draft-media-label">
                        Видео
                    </span>

                </div>

            </div>

            <div class="draft-field">
                <label for="deposit-month-name">
                    Название месяца
                </label>

                <input
                        id="deposit-month-name"
                        type="text"
                        name="deposit_month_name"
                        required
                >
            </div>

            <button
                    class="filter-button"
                    type="submit"
            >
                Далее
            </button>

        </form>

        {{ end }}

    </main>

    <nav class="bottom-nav">

        <a
                class="nav-item"
                href="/deposit_month"
        >
            <span class="nav-icon">⌂</span>
            <span>Лента</span>
        </a>

        <a
                class="nav-item active"
                href="/deposit_month/draft"
        >
            <span class="nav-icon">＋</span>
            <span>Добавление</span>
        </a>

        <a
                class="nav-item"
                href="/deposit_month/list"
        >
            <span class="nav-icon">▦</span>
            <span>Месяцы</span>
        </a>

    </nav>

</div>

{{ if not .has_draft }}

<script>
    const imageInput =
        document.getElementById("deposit-month-image");

    const imagePreview =
        document.getElementById("image-preview");

    imageInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) {
            return;
        }

        imagePreview.src = URL.createObjectURL(file);
    });

    const videoInput =
        document.getElementById("deposit-month-video");

    const videoPreview =
        document.getElementById("video-preview");

    videoInput.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) {
            return;
        }

        videoPreview.src = URL.createObjectURL(file);
        videoPreview.load();

        videoPreview.play().catch(function () {});
    });
</script>

{{ end }}

</body>
</html>
