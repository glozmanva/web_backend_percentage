<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>{{ .deposit_month.Name }}</title>

    <link
            rel="stylesheet"
            href="/static/css/deposit_month.css"
    >
</head>

<body>

<div class="app">

    <main class="feed">

        <video
                class="feed-video"
                autoplay
                muted
                loop
                playsinline
                preload="auto"
                onerror="this.src='/static/default/default.mp4'"
        >
            <source
                    src="{{ if .deposit_month.VideoURL }}{{ .deposit_month.VideoURL }}{{ else }}/static/default/default.mp4{{ end }}"
                    type="video/mp4"
            >
        </video>

        <div class="feed-overlay"></div>

        <section class="feed-info">

            <h1 class="feed-month-title">
                {{ .deposit_month.Name }}
            </h1>

            <div class="feed-description">

                <div
                        id="feed-description-text"
                        class="feed-description-text"
                >
                    {{ .deposit_month.Description }}
                </div>

                <button
                        id="feed-description-toggle"
                        class="feed-description-toggle"
                        type="button"
                >
                    Ещё
                </button>

            </div>

        </section>

        <aside class="feed-side">

            <div class="feed-stat">

                <span class="feed-stat-value">
                    {{ .deposit_month.MonthNumber }}
                </span>

                <span class="feed-stat-label">
                    месяц
                </span>

            </div>

            <div class="feed-stat">

                <span class="feed-stat-value">
                    {{ .deposit_month.DaysCount }}
                </span>

                <span class="feed-stat-label">
                    дней
                </span>

            </div>

            <div class="feed-like-content">

                <span class="feed-heart">
                    ♡
                </span>

                <span class="feed-like-count">
                    {{ .likes_count }}
                </span>

            </div>

            <a
                    class="feed-next"
                    href="/deposit_month?deposit_month_id={{ .deposit_month.ID }}&next=true"
                    aria-label="Следующий месяц"
            >
                →
            </a>

        </aside>

    </main>

    <nav class="bottom-nav">

        <a
                class="nav-item active"
                href="/deposit_month"
        >
            <span class="nav-icon">⌂</span>
            <span>Лента</span>
        </a>

        <a
                class="nav-item"
                href="/deposit_month/draft"
        >
            <span class="nav-icon">＋</span>
            <span>Добавление</span>
        </a>

        <a
                class="nav-item"
                href="/deposit_month/list"
        >
            <span class="nav-icon">▦</span>
            <span>Месяцы</span>
        </a>

    </nav>

</div>

<script>
    const descriptionText =
        document.getElementById("feed-description-text");

    const descriptionToggle =
        document.getElementById("feed-description-toggle");

    function checkDescriptionOverflow() {
        const lineHeight =
            parseFloat(
                window.getComputedStyle(descriptionText).lineHeight
            );

        const twoLinesHeight =
            lineHeight * 2;

        if (descriptionText.scrollHeight <= twoLinesHeight + 2) {
            descriptionToggle.style.display = "none";
        }
    }

    checkDescriptionOverflow();

    descriptionToggle.addEventListener("click", function () {

        const isExpanded =
            descriptionText.classList.contains("expanded");

        if (isExpanded) {
            descriptionText.classList.remove("expanded");
            descriptionToggle.textContent = "Ещё";
        } else {
            descriptionText.classList.add("expanded");
            descriptionToggle.textContent = "Свернуть";
        }
    });
</script>

</body>
</html>
