<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Добавление расчёта</title>

    <link
            rel="stylesheet"
            href="/static/css/months.css"
    >
</head>

<body>

<div class="app">

    <main class="draft-content">

        <h1 class="page-title">
            Добавление расчёта
        </h1>

        <form class="draft-form">

            <div class="draft-field">

                <label>
                    Изображение
                </label>

                <div class="draft-image">

                    <img
                            src="{{ .month.ImageURL }}"
                            alt="{{ .month.Name }}"
                    >

                </div>

            </div>

            <input
                    type="hidden"
                    name="image_url"
                    value="{{ .month.ImageURL }}"
            >


            <div class="draft-field">

                <label>
                    Видео
                </label>

                <div
                        class="draft-video-field"
                        data-video-url="{{ .month.VideoURL }}"
                >

                    <span class="video-plus">
                        ＋
                    </span>

                    <span>
                        Видео · MP4
                    </span>

                </div>

            </div>

            <input
                    type="hidden"
                    name="video_url"
                    value="{{ .month.VideoURL }}"
            >


            <div class="draft-field">

                <label for="month-name">
                    Название месяца
                </label>

                <input
                        id="month-name"
                        type="text"
                        name="name"
                        value="{{ .month.Name }}"
                >

            </div>

            <div class="draft-field">

                <label for="month-short-description">
                    Краткое описание
                </label>

                <input
                        id="month-short-description"
                        type="text"
                        name="short_description"
                        value="{{ .month.ShortDescription }}"
                >

            </div>

            <div class="draft-field">

                <label for="month-description">
                    Описание
                </label>

                <textarea
                        id="month-description"
                        name="description"
                        rows="3"
                >{{ .month.Description }}</textarea>

            </div>

            <div class="draft-field">

                <label for="month-number">
                    Номер месяца
                </label>

                <input
                        id="month-number"
                        type="number"
                        name="month_number"
                        min="1"
                        max="12"
                        value="{{ .month.MonthNumber }}"
                >

            </div>

            <div class="draft-field">

                <label for="month-days">
                    Количество дней
                </label>

                <input
                        id="month-days"
                        type="number"
                        name="days"
                        min="28"
                        max="31"
                        value="{{ .month.DaysCount }}"
                >

            </div>

            <button
                    class="draft-button"
                    type="button"
            >
                Добавить
            </button>

        </form>

    </main>

    <nav class="bottom-nav">

        <a
                class="nav-item"
                href="/deposit-month"
        >
            <span class="nav-icon">⌂</span>
            <span>Лента</span>
        </a>

        <a
                class="nav-item active"
                href="/deposit-month/draft"
        >
            <span class="nav-icon">＋</span>
            <span>Добавление</span>
        </a>

        <a
                class="nav-item"
                href="/deposit-months"
        >
            <span class="nav-icon">▦</span>
            <span>Месяцы</span>
        </a>

    </nav>

</div>

</body>

</html>
