<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Расчётные месяцы</title>

    <link
            rel="stylesheet"
            href="/static/css/deposit_month.css"
    >
</head>

<body>

<div class="app">

    <main class="list-content">

        <h1 class="page-title">
            Расчётные месяцы
        </h1>

        <form
                class="deposit-month-filter"
                action="/deposit_month/list"
                method="GET"
        >

            <div class="filter-title">
                Количество дней
            </div>

            <div class="dual-range">

                <div class="range-track"></div>

                <div
                        class="range-selected-track"
                        style="
                        left: {{ .min_days_position }}%;
                        width: calc(
                            {{ .max_days_position }}% -
                            {{ .min_days_position }}%
                        );
                    "
                ></div>

                <input
                        class="range-input"
                        type="range"
                        name="min_days_count"
                        min="28"
                        max="31"
                        step="1"
                        value="{{ .min_days_count }}"
                        aria-label="Минимальное количество дней"
                >

                <input
                        class="range-input"
                        type="range"
                        name="max_days_count"
                        min="28"
                        max="31"
                        step="1"
                        value="{{ .max_days_count }}"
                        aria-label="Максимальное количество дней"
                >

            </div>

            <div class="range-labels">

                <span>28</span>
                <span>29</span>
                <span>30</span>
                <span>31</span>

            </div>

            <button
                    class="filter-button"
                    type="submit"
            >
                Найти
            </button>

        </form>

        <div class="deposit-month-grid">

            {{ range .deposit_months }}

            <article class="deposit-month-card">

                <a
                        class="deposit-month-card-link"
                        href="/deposit_month?deposit_month_id={{ .ID }}"
                >

                    <img
                            class="deposit-month-card-image"
                            src="{{ if .ImageURL }}{{ .ImageURL }}{{ else }}/static/default/default.jpg{{ end }}"
                            alt="{{ .Name }}"
                            onerror="this.onerror=null; this.src='/static/default/default.jpg';"
                    >

                    <div class="deposit-month-card-info">

                        <h2>
                            {{ .Name }}
                        </h2>

                        <span class="deposit-month-card-number">
                            {{ .MonthNumber }}
                        </span>

                        <span class="deposit-month-card-days">
                            {{ .DaysCount }} дней
                        </span>

                    </div>

                </a>

                <div class="deposit-month-card-like">
                    <span>♡</span>
                    <span>{{ .LikesCount }}</span>
                </div>

                <form
                        class="deposit-month-delete-form"
                        action="/deposit_month/delete"
                        method="POST"
                >
                    <input
                            type="hidden"
                            name="deposit_month_id"
                            value="{{ .ID }}"
                    >

                    <button
                            class="deposit-month-delete-button"
                            type="submit"
                            aria-label="Удалить карточку"
                            title="Удалить"
                    >
                        ×
                    </button>
                </form>

            </article>

            {{ else }}

            <p class="empty-result">
                Месяцы в выбранном диапазоне не найдены.
            </p>

            {{ end }}

        </div>

    </main>

    <nav class="bottom-nav">

        <a
                class="nav-item"
                href="/deposit_month"
        >
            <span class="nav-icon">⌂</span>
            <span>Лента</span>
        </a>

        <a
                class="nav-item"
                href="/deposit_month/draft"
        >
            <span class="nav-icon">＋</span>
            <span>Добавление</span>
        </a>

        <a
                class="nav-item active"
                href="/deposit_month/list"
        >
            <span class="nav-icon">▦</span>
            <span>Месяцы</span>
        </a>

    </nav>

</div>

</body>
</html>
