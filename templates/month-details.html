<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>{{ .month.Name }}</title>

  <link
          rel="stylesheet"
          href="/static/css/months.css"
  >
</head>

<body>

<div class="app app-feed">

  <main class="feed">

    <video
            class="feed-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
    >
      <source
              src="{{ .month.VideoURL }}"
              type="video/mp4"
      >
    </video>

    <div class="feed-overlay"></div>

    <section class="feed-info">

      <h1 class="feed-title">

                <span class="feed-number">
                    {{ printf "%02d" .month.MonthNumber }}
                </span>

        {{ .month.Name }}

      </h1>

      <details class="feed-description">

        <summary>

          {{ .month.ShortDescription }}

          <span class="more-label"></span>

        </summary>

        <p>
          {{ .month.Description }}
        </p>

      </details>

      <div class="feed-fields">

        {{ .month.DaysCount }}

        {{ if eq .month.DaysCount 31 }}
        день
        {{ else }}
        дней
        {{ end }}

      </div>

    </section>

    <div class="feed-like">

      <div class="feed-like-static">

                <span class="feed-like-icon">
                    ♡
                </span>

        <span class="feed-like-count">
                    {{ .likesCount }}
                </span>

      </div>

    </div>

    <a
            class="next-button"
            href="/deposit-month?id={{ .month.ID }}&next=true"
    >
      Следующий →
    </a>

  </main>

  <nav class="bottom-nav">

    <a
            class="nav-item active"
            href="/deposit-month"
    >
      <span class="nav-icon">⌂</span>
      <span>Лента</span>
    </a>

    <a
            class="nav-item"
            href="/deposit-month/draft"
    >
      <span class="nav-icon">＋</span>
      <span>Добавление</span>
    </a>

    <a
            class="nav-item"
            href="/deposit-months"
    >
      <span class="nav-icon">▦</span>
      <span>Месяцы</span>
    </a>

  </nav>

</div>

</body>

</html>
